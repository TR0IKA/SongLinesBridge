plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'dev.songlines.bridge'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.songlines.bridge'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
